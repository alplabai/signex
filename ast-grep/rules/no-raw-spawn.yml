id: no-raw-spawn
language: rust
severity: error
message: "No raw spawn in signex-app: IO and async work is returned as an iced Task (Task::perform) or a Subscription."
note: |
  A raw spawn runs outside update(): nothing reports its failure, and its
  result can land on a document that has since changed. One-shot work is
  `Task::perform`; a worker that streams results sends on a channel that a
  Subscription turns into Messages. See
  docs/architecture/adr-0001-app-structure-and-boundaries.md, section D8, and
  docs/architecture/adr-0003-deferred-work-and-consistent-history.md.
  An unavoidable spawn takes `// ast-grep-ignore: no-raw-spawn` with the
  reason on the line above.
files:
  - crates/signex-app/src/**/*.rs
ignores:
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests/**"
rule:
  all:
    - any:
        - pattern: tokio::spawn($$$)
        - pattern: std::thread::spawn($$$)
        - pattern: thread::spawn($$$)
        - pattern: tokio::task::spawn($$$)
    - not:
        inside:
          stopBy: end
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
