id: no-raw-literal-widget
valid:
  - 'fn v() { container(text(raw("X"))); }'
  - 'fn v() { button(text(raw("X"))); }'
  - 'fn v() { tooltip(a, text(raw("X")), Position::Top); }'
  - 'fn v() { UserText::new(name); }'
  - 'fn v() { Text::from(label); }'
  - 'fn v() -> Result<(), E> { Err("x".into()) }'
  - 'fn v() { let s: String = "x".into(); }'
  - |
    #[cfg(test)]
    mod tests {
        fn t() { container("X"); }
    }
  - 'fn v() { iced::widget::container(text(raw("X"))); }'
  - 'fn v() { iced::widget::tooltip(a, text(raw("X")), Position::Top); }'
  - 'fn v() { center(text(raw("X"))); hover(a, text(raw("Y"))); Span::from(label); }'
  - 'fn v() { Container::new(text(raw("X"))); Scrollable::new(a); MouseArea::new(a); }'
invalid:
  - 'fn v() { center("X"); }'
  - 'fn v() { center_x("X"); }'
  - 'fn v() { center_y("X"); }'
  - 'fn v() { right("X"); }'
  - 'fn v() { bottom("X"); }'
  - 'fn v() { float("X"); }'
  - 'fn v() { pin("X"); }'
  - 'fn v() { sensor("X"); }'
  - 'fn v() { opaque("X"); }'
  - 'fn v() { iced::widget::center("X"); }'
  - 'fn v() { hover("X", a); }'
  - 'fn v() { hover(a, "Y"); }'
  - 'fn v() { iced::widget::hover("X", "Y"); }'
  - 'fn v() { Container::new("X"); }'
  - 'fn v() { iced::widget::Container::new("X"); }'
  - 'fn v() { Scrollable::new("X"); }'
  - 'fn v() { MouseArea::new("X"); }'
  - 'fn v() { iced::widget::MouseArea::new("X"); }'
  - 'fn v() { Span::from("X"); }'
  - 'fn v() { iced::widget::text::Span::from("X"); }'
  - 'fn v() { iced::widget::container("X"); }'
  - 'fn v() { iced::widget::scrollable("X"); }'
  - 'fn v() { iced::widget::tooltip(a, "X", Position::Top); }'
  - 'fn v() { signex_i18n::UserText::new("X"); }'
  - 'fn v() { iced::widget::Text::from("X"); }'
  - 'fn v() { container("X"); }'
  - 'fn v() { scrollable("X"); }'
  - 'fn v() { mouse_area("X"); }'
  - 'fn v() { button("X"); }'
  - 'fn v() { button(container("X")); }'
  - 'fn v() { tooltip(a, "X", Position::Top); }'
  - 'fn v() { Element::from("X"); }'
  - 'fn v() { Text::from("X"); }'
  - 'fn v() { UserText::new("X"); }'
  - 'fn v() { "X".boxed(); }'
  - 'fn v() { let t: Text = "X".into(); }'
  - "fn v() -> Element<M> { column.push(\"X\".into()).into() }"
