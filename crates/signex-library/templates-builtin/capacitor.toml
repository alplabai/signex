class = "capacitor"
description = "Fixed-value capacitor"

[[required_params]]
name = "value"
kind = "measurement"
unit = "F"

[[required_params]]
name = "tolerance"
kind = "measurement"
unit = "%"

[[required_params]]
name = "voltage_max"
kind = "measurement"
unit = "V"

[[optional_params]]
name = "dielectric"
kind = "text"

[[optional_params]]
name = "esr"
kind = "measurement"
unit = "ohm"

[[optional_params]]
name = "package"
kind = "text"

# The Components panel view the category opens with (mockup row 52).
[view]
columns = ["row:part_number", "value", "voltage_max", "dielectric", "tolerance", "package", "row:stock", "row:price"]
sort = [{ column = "voltage_max" }]
group = [{ column = "package" }, { column = "value" }]
pinned = ["value", "voltage_max", "dielectric", "package"]
