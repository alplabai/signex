[package]
name = "signex-library"
description = "Component library subsystem for Signex — data model, adapters, diff, search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
url = { version = "2", features = ["serde"] }
csv = "1.3"

# Atomic-write helper used by adapters (HI-6).
signex-types = { workspace = true }

# Optional 2D parametric sketch field on Footprint (v0.13+).
signex-sketch = { workspace = true }

# Heuristic AI-stub for symbol pinout extraction (WS-F).
pdf-extract = { workspace = true, optional = true }
regex = { workspace = true, optional = true }

# Tantivy search backend (WS-E).
tantivy = { workspace = true, optional = true }

# Local + git adapter (WS-A).
git2 = { workspace = true, optional = true }
walkdir = { version = "2", optional = true }

# Database adapter (WS-B) + community distributor adapters (WS-C) — both use
# the same `reqwest` blocking client. Adding `blocking` to the workspace
# default features (json + rustls-tls).
reqwest = { workspace = true, features = ["blocking"], optional = true }

# Distributor adapters (WS-C).
keyring = { workspace = true, optional = true }
# DigiKey scaffolding uses oauth2's blocking sync HTTP integration.
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls", "reqwest-blocking"], optional = true }
tokio = { workspace = true, optional = true }
dirs = { version = "5", optional = true }

# Logging — used to surface non-fatal errors (cache writes, token rotation,
# mutex poison, etc.) without aborting the call. Light-weight and pure-Rust;
# kept un-feature-gated so every adapter can `tracing::warn!` consistently.
tracing = { workspace = true }

# OS-keychain backends (#976). keyring 3.x ships NO default backend: without one
# every OS silently falls back to its in-memory mock and nothing is persisted.
# Features are enabled per target and unify with the optional `keyring` dep above.
# Linux uses the pure-Rust zbus Secret Service client (`async-secret-service` +
# `crypto-rust`), so no libdbus / libsecret / OpenSSL is needed at build time.
# Deliberately NOT `linux-native-*-persistent`: its keyutils layer would keep
# working with no Secret Service and silently lose secrets on reboot.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "crypto-rust", "async-io"], optional = true }

[features]
default = []
ai-stub = ["dep:pdf-extract", "dep:regex"]
search-tantivy = ["dep:tantivy"]
local-git = ["dep:git2", "dep:walkdir", "dep:dirs"]
# Hermetic commit identity for tests that make real git commits; see
# `git_identity::test_identity`. Enabled only through dev-dependencies.
test-identity = ["local-git"]
# Exposes seams that bypass the OS keyring (injected token sink). Enabled only
# through dev-dependencies; never part of a shipped build.
test-support = []
database = ["dep:reqwest"]
distributors-community = [
    "dep:keyring",
    "dep:oauth2",
    "dep:reqwest",
    "dep:tokio",
    "dep:dirs",
]

[dev-dependencies]
signex-library = { path = ".", features = ["test-identity", "test-support"] }
tempfile = "3"
pdf-writer = { workspace = true }
tokio = { workspace = true }
wiremock = "0.6"

# Skipped loudly, not compiled to 0 tests, when `local-git` is off.
[[test]]
name = "local_git_adapter"
required-features = ["local-git"]

[[test]]
name = "pricing_refresh"
required-features = ["local-git"]

# GH #548 — inherit [workspace.lints.rust] (unused_must_use = deny).
[lints]
workspace = true
