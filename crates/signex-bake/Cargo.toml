[package]
name = "signex-bake"
description = "Sketch -> footprint primitive bake pipeline (signex-sketch + signex-library)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
signex-sketch = { workspace = true }
signex-library = { workspace = true }
signex-types = { workspace = true }
# GH #599 — bake warnings reach the Properties panel through the
# `warnings` vec; the ones that change what the netlist binds to also
# go to the log. signex-app installs a `log` sink and enables
# tracing's `log` feature, so these records reach the Messages panel.
tracing = { workspace = true }

# GH #548 — inherit [workspace.lints.rust] (unused_must_use = deny).
[lints]
workspace = true
