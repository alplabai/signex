[package]
name = "signex-engine"
description = "Editing engine skeleton for Signex EDA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
signex-types = { workspace = true }
signex-history = { workspace = true }
# The one footprint flip (ADR-0005 §8); the engine calls it, it does not copy it.
pcb-geom = { path = "../pcb-geom" }
# For `pt_key` / `point_on_segment` — the netlist's own "same point" and
# "point on wire" predicates. Junction autoplacement gates every dot it mints
# on the exact rule the netlist will apply to it, instead of hand-rolling a
# second, more lenient answer (D5.5, issue #402).
signex-net = { workspace = true }
# The DRC fixes (#2940) check each edit with the design rule check; the
# router's results are checked by it in tests (#2389).
signex-drc = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
# The Compare Board with Schematic answer (#2462) and the project's stored
# rails (#2943) are JSON values.
serde_json = { workspace = true }
# Find and Replace regex mode (#2525).
regex = { workspace = true }
[dev-dependencies]
signex-erc = { workspace = true }
tempfile = "3"

# GH #548 — inherit [workspace.lints.rust] (unused_must_use = deny).
[lints]
workspace = true
