# Built-in "Classic" single-key keyboard shortcut profile defaults for Signex.
#
# `Mod` is Cmd on macOS and Ctrl elsewhere; a plain `Ctrl` stays the physical
# Control key (it is kept where Cmd would collide with a macOS system chord).
# Bindings inside one section load in alphabetical order of their trigger
# text, and the last binding of a command gives its menu hint. The global
# sections are split so the load order is the one the all-`Ctrl` spelling had
# (see docs/KEYBOARD_SHORTCUTS.md, "Built-in profiles").

[signex_settings]
application = "signex"
file_kind = "keyboard_shortcuts"
version = 1

[keyboard_shortcuts]
schema_version = 1
profile_id = "classic"
profile_name = "Classic"
profile_kind = "built_in"
description = "Classic single-key keyboard shortcut defaults for Signex."

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"/" = "switch_segment_posture"
"A" = "place_symbol"
"Alt+1" = "fast_grid_1"
"Alt+2" = "fast_grid_2"
"Alt+3" = "select_node_or_connection_item"
"Alt+4" = "cycle_fast_grid"
"Alt+A" = "annotate_schematic_quietly"
"Alt+Backspace" = "leave_sheet"
"Alt+Left" = "sheet_navigation_back"
"Alt+Right" = "sheet_navigation_forward"
"Alt+Up" = "navigate_up_hierarchy"
"B" = "place_bus"
"Backspace" = "undo_last_segment"
"Mod+," = "open_preferences"
"Mod+4" = "select_expand_connection"
"Mod+A" = "select_all"
"Mod+C" = "copy"
"Mod+D" = "duplicate"
"Mod+E" = "edit_selected_symbol_in_symbol_editor"
"Mod+F" = "find"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Ctrl+F5" = "zoom_to_selection_area"
"Ctrl+G" = "toggle_search_panel"
"Ctrl+Home" = "zoom_to_all_objects"
"Ctrl+K" = "open_command_palette"
"Mod+L" = "place_global_label"
"Mod+N" = "new_document"
"Mod+O" = "open_document"
"Mod+P" = "print"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Ctrl+Q" = "cycle_unit"
"Mod+S" = "save_document"
"Mod+Shift+A" = "unselect_all"
"Mod+Shift+E" = "edit_library_symbol"
"Mod+Shift+F" = "import_graphics"
"Mod+Shift+G" = "toggle_visible_grid"
"Mod+Shift+P" = "open_command_palette"
"Mod+Shift+S" = "save_document_as"
"Mod+Shift+V" = "paste_special"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Ctrl+Shift+Z" = "redo"
"Mod+V" = "paste"
"Mod+X" = "cut"

# macOS only: redo keeps its plain Ctrl+Shift+Z (the same chord on every OS)
# and gains the Mac chord here; this section sits before Ctrl+Y so redo's menu
# hint stays Ctrl+Y.
[[keyboard_shortcuts.sections]]
platform = "macos"
context = "global"

[keyboard_shortcuts.sections.bindings]
"Mod+Shift+Z" = "redo"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Ctrl+Y" = "redo"
"Mod+Z" = "undo"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"D" = "open_datasheet"
"Delete" = "delete_selection"
"E" = "edit_selected_object_properties"
"Escape" = "cancel_current_tool"
"F" = "edit_footprint_field"
"F1" = "zoom_in_at_cursor"
"F2" = "zoom_out_at_cursor"
"F3" = "find_next"
"F4" = "center_on_cursor"
"F5" = "refresh_view"
"F8" = "run_erc"
"F9" = "toggle_auto_focus"
"G" = "drag_keep_connections"
"H" = "place_hierarchical_label"
"Home" = "zoom_to_fit"
"I" = "draw_graphic_line"
"Insert" = "repeat_last_item"
"J" = "place_junction"
"L" = "place_local_net_label"
"M" = "move_selection"
"N" = "next_grid"
"O" = "autoplace_fields"
"P" = "place_power_symbol"
"PageDown" = "next_sheet"
"PageUp" = "previous_sheet"
"Q" = "place_no_connect"
"R" = "rotate_counterclockwise"
"S" = "draw_hierarchical_sheet"
"Shift+Alt+A" = "force_annotate_all_schematics"
"Shift+B" = "place_design_block"
"Shift+F3" = "find_previous"
"Shift+N" = "previous_grid"
"Shift+R" = "rotate_clockwise"
"Shift+Space" = "cycle_wire_bus_graphic_mode"
"Shift+Tab" = "previous_highlighted_net_item"
"Space" = "reset_local_coordinates"
"T" = "place_text"
"Tab" = "next_highlighted_net_item"
"U" = "edit_reference_designator"
"V" = "edit_value"
"W" = "place_wire"
"X" = "mirror_x"
"Y" = "mirror_y"
"Z" = "place_wire_to_bus_entry"
"`" = "highlight_net_under_cursor"
"~" = "clear_net_highlighting"

# The board view (PCB tabs only): `+` and `*` step to the next copper layer,
# `-` to the previous. A shifted `+` or `*` is its own stroke on a US layout.
[[keyboard_shortcuts.sections]]
context = "pcb"

[keyboard_shortcuts.sections.bindings]
"+" = "next_layer"
"Shift++" = "next_layer"
"*" = "next_layer"
"Shift+*" = "next_layer"
"-" = "prev_layer"

[[keyboard_shortcuts.sections]]
context = "footprint"

[keyboard_shortcuts.sections.bindings]
"1" = "footprint_mode_sketch"
"2" = "footprint_mode_pads"
"3" = "footprint_mode_view_3d"
