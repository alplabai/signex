# Built-in keyboard shortcut defaults based on Altium references.
#
# `Mod` is Cmd on macOS and Ctrl elsewhere; a plain `Ctrl` stays the physical
# Control key (it is kept where Cmd would collide with a macOS system chord).
# Bindings inside one section load in alphabetical order of their trigger
# text, and the last binding of a command gives its menu hint. The global
# sections are split so the load order is the one the all-`Ctrl` spelling had
# (see docs/KEYBOARD_SHORTCUTS.md, "Built-in profiles").

[signex_settings]
application = "signex"
file_kind = "keyboard_shortcuts"
version = 1

[keyboard_shortcuts]
schema_version = 1
profile_id = "altium"
profile_name = "Altium"
profile_kind = "built_in"
description = "Altium-style keyboard shortcut defaults for Signex."

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Alt+A" = "annotate_schematic_quietly"
"Backspace" = "remove_last_vertex"
"Mod+C" = "copy"
"Mod+D" = "duplicate"
"Mod+N" = "new_document"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Ctrl+Q" = "cycle_unit"
"Mod+R" = "rubber_stamp_copy"
"Mod+Shift+S" = "save_document_as"
"Mod+Shift+V" = "smart_paste"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Ctrl+Space" = "cycle_wiring_mode"
"Mod+V" = "paste"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Ctrl+W" = "place_wire"
"Mod+X" = "cut"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"DoubleClick" = "edit_object_properties"
"E W" = "break_wire"
"Enter" = "placement_accept"
"Escape" = "cancel_current_tool"
"F1" = "show_current_command_hotkeys"
"F2" = "edit_text_in_place"
"F5" = "open_net_color_palette"
"F8" = "run_erc"
"F9" = "toggle_auto_focus"
"Insert" = "copy_attributes_or_add_vertex"
"M M" = "move_object"
"P B" = "place_bus"
"P N" = "place_net_label"
"P P" = "open_components_panel"
"P V K" = "place_compile_mask"
"P V N" = "place_no_erc"
"P W" = "place_wire"
"R I" = "report_manager_bom"
"Shift+Alt+A" = "force_annotate_all_schematics"
"Shift+F1" = "show_current_command_shortcuts"
"Shift+Space" = "rotate_clockwise"
"Space" = "rotate_counterclockwise"
"T A" = "annotate_schematic"
"T A E" = "reset_schematic_designators"
"T P" = "open_schematic_preferences"
"Tab" = "placement_properties"
"X" = "mirror_x"
"Y" = "mirror_y"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Alt+Click" = "highlight_related_net_objects"
"Mod+," = "open_preferences"
"Mod+A" = "select_all"
"Mod+F" = "find"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Ctrl+F4" = "close_active_document"
"Ctrl+H" = "find_and_replace"
"Ctrl+M" = "measure_distance"
"Mod+O" = "open_document"
"Mod+P" = "print"

[[keyboard_shortcuts.sections]]
