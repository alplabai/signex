[keyboard_shortcuts.sections.bindings]
"Ctrl+Shift+Tab" = "previous_document_tab"
"Mod+Shift+X" = "toggle_cross_select_mode"

# macOS only: Cmd+H hides the app and Cmd+W is the Mac close chord, so Replace
# and Close Document get the Mac chords next to Ctrl+H / Ctrl+F4. Redo keeps
# its plain Ctrl+Shift+Z below (the same chord on every OS) and gains the Mac
# chord here; this section sits before Ctrl+Y so redo's menu hint stays Ctrl+Y.
[[keyboard_shortcuts.sections]]
platform = "macos"
context = "global"

[keyboard_shortcuts.sections.bindings]
"Mod+Alt+F" = "find_and_replace"
"Mod+Shift+Z" = "redo"
"Mod+W" = "close_active_document"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Ctrl+Shift+Z" = "redo"
"Ctrl+Tab" = "next_document_tab"
"Ctrl+Y" = "redo"
"Mod+Z" = "undo"

[[keyboard_shortcuts.sections]]
context = "global"

[keyboard_shortcuts.sections.bindings]
"Delete" = "delete_selection"
"End" = "refresh_view"
"F11" = "toggle_properties_panel"
"F12" = "toggle_schematic_filter_panel"
"F3" = "find_next"
"F4" = "toggle_floating_panels"
"G" = "cycle_snap_grid_forward"
"Home" = "center_view_at_cursor"
"PageDown" = "zoom_out_at_cursor"
"PageUp" = "zoom_in_at_cursor"
"Shift+Click" = "toggle_selection"
"Shift+E" = "toggle_electrical_grid"
"Shift+F" = "find_similar_objects"
"Shift+F12" = "toggle_schematic_list_panel"
"Shift+F3" = "find_previous"
"Shift+G" = "cycle_snap_grid_backward"

# The board view (PCB tabs only): `+` and `*` step to the next copper layer,
# `-` to the previous. A shifted `+` or `*` is its own stroke on a US layout.
[[keyboard_shortcuts.sections]]
context = "pcb"

[keyboard_shortcuts.sections.bindings]
"+" = "next_layer"
"Shift++" = "next_layer"
"*" = "next_layer"
"Shift+*" = "next_layer"
"-" = "prev_layer"

[[keyboard_shortcuts.sections]]
context = "footprint"

[keyboard_shortcuts.sections.bindings]
"1" = "footprint_mode_sketch"
"2" = "footprint_mode_pads"
"3" = "footprint_mode_view_3d"
