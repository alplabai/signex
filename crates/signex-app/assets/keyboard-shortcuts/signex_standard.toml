# #2416: the sheet's placement tools with no key before (sheet tabs only).
# Mockup row 158: `Mod+G` makes a union of the selection; a sheet-only reuse of the
# key, so the footprint editor's own use of it stays free (DECISIONS
# 2026-11-19).
[[keyboard_shortcuts.sections]]
context = "schematic"

[keyboard_shortcuts.sections.bindings]
