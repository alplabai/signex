"P C" = "place_off_sheet_connector"
"P R" = "place_port"
"P S" = "place_sheet_symbol"
"P U" = "place_bus_entry"
"P X" = "place_no_connect"

# The board view (PCB tabs only): `+` steps to the next layer of the board,
# `*` to the next signal layer,
# `-` to the previous layer; Shift+S turns single-layer mode on or off; `3`
# shows the board in 3D or flat again. A
# shifted `+` or `*` is its own stroke on a US layout. #2406: `1` enters or
# leaves the board sketch, `L` flips the selection or the part on the cursor
# to the other side, `N` shows or hides the ratsnest, `F` changes the
# footprint, `P K` draws a keepout and `T D` runs the design rule check.
# `E O S` sets the board origin (Edit ▸ Origin ▸ Set, 2026-11-18).
[[keyboard_shortcuts.sections]]
context = "pcb"

[keyboard_shortcuts.sections.bindings]
"+" = "next_layer"
"Shift++" = "next_layer"
"*" = "next_signal_layer"
"Shift+*" = "next_signal_layer"
"-" = "prev_layer"
"1" = "board_sketch"
"3" = "view_board_3d"
"E O S" = "set_board_origin"
"F" = "change_footprint"
"L" = "flip_selection"
"N" = "toggle_ratsnest"
"P F" = "place_board_fill"
"P G" = "place_board_polygon_pour"
"P K" = "place_board_keepout"
"P R" = "place_board_region"
"P T" = "place_board_track"
"P V" = "place_board_via"
"Shift+S" = "toggle_single_layer_mode"
"T D" = "run_drc"

[[keyboard_shortcuts.sections]]
context = "footprint"

[keyboard_shortcuts.sections.bindings]
"1" = "footprint_mode_sketch"
"2" = "footprint_mode_pads"
"3" = "footprint_mode_view_3d"
