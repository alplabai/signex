[package]
name = "signex-commands"
description = "The command vocabulary every Signex front end shares: the command catalog, shortcut contexts and modifiers, operands, targets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# UI-free (ADR-0006): the crate is in DOMAIN, so `scripts/check_arch_guard.sh`
# refuses a direct iced / wgpu / signex-i18n dependency (UI_STACK); Fluent and
# ICU reach the workspace only through signex-i18n. Catalog labels name
# signex-i18n-ids message ids; the app renders them.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
signex-i18n-ids = { workspace = true }
signex-types = { workspace = true }

[lints]
workspace = true
