[package]
name = "signex-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wgpu = "=27.0.1"
glam = "0.32.1"
bytemuck = { version = "1", features = ["derive"] }
cryoglyph = "0.1.0"
ttf-parser = { workspace = true }
rstar = "0.12"
bitflags = "2"
log = "0.4"
# Concave-safe polygon fill: the authoritative ear-clip triangulator (see
# `polygon.rs::append_fill`) already lives in signex-sketch's geom toolkit —
# reused here rather than re-derived, per the one-authoritative-contract rule.
signex-sketch = { workspace = true }
signex-types = { workspace = true }

[features]
# Test-only helpers for the crates above this one (`polygon_fill_triangles`).
test-support = []
# Offscreen debug/golden render passes (`debug_pass`). Dev toggle: off in every
# shipped build; the integration tests switch it on through the dev-dependency
# below.
debug-pass = ["test-support"]

[dev-dependencies]
signex-gfx = { workspace = true, features = ["debug-pass"] }
pollster = "0.4"
serde.workspace = true
serde_json.workspace = true
# PNG golden references (#113); already in the lockfile via signex-app.
image = { version = "0.25", default-features = false, features = ["png"] }

# GH #548 — inherit [workspace.lints.rust] (unused_must_use = deny).
[lints]
workspace = true
