[package]
name = "signex-sketch"
description = "2D parametric sketcher for footprints — entities, constraints, solver, bake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
signex-types = { workspace = true }
# GH #599 — the solver reports the diagnostics it cannot compute
# (constraints whose residual will not evaluate) instead of dropping
# them. signex-app installs a `log` sink and enables tracing's `log`
# feature, so these records reach the Messages panel.
tracing = { workspace = true }

[dev-dependencies]
approx = "0.5"

# GH #548 — inherit [workspace.lints.rust] (unused_must_use = deny).
[lints]
workspace = true
