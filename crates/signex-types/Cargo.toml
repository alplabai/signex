[package]
name = "signex-types"
description = "Domain types for Signex EDA — schematic, PCB, net, layer, theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
signex-expr = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# The browser has no OS randomness; uuid takes it from JS there (#2431). Cargo
# unifies the feature, so this covers every crate that builds on signex-types.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tempfile = "3"

# GH #548 — inherit [workspace.lints.rust] (unused_must_use = deny).
[lints]
workspace = true
