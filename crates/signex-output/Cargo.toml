[package]
name = "signex-output"
description = "Output generation for Signex EDA — PDF, BOM, netlist, sheet templates, print preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pcb-geom = { path = "../pcb-geom" }
signex-bom = { path = "../signex-bom" }
# Rich text notes (#1114): compiled and drawn as vector paths in the SVG and
# PDF export, the same paths the canvas draws.
signex-notebook = { path = "../signex-notebook" }
signex-types = { path = "../signex-types" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pdf-writer = { workspace = true }
rust_xlsxwriter = { workspace = true }
tiny-skia = { workspace = true }
ttf-parser = { workspace = true }
uuid = { workspace = true }
# #1116: placed images in an export. The GIF's first frame is decoded, an
# image stream is deflated, and an SVG picture becomes vector paths (no text
# shaping: a picture's text is not drawn).
gif = "0.14"
miniz_oxide = "0.8"
usvg = { version = "0.48", default-features = false }

[[example]]
name = "qa_harness"
path = "examples/qa_harness.rs"

# GH #548 — inherit [workspace.lints.rust] (unused_must_use = deny).
[lints]
workspace = true
