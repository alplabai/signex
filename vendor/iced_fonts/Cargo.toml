# NOTE: this manifest started as the normalised Cargo.toml from the crates.io
# package, but it has been edited by hand for Signex (dependencies retargeted
# to the alplabai/iced fork, features and files removed; see vendor/README.md).
# The original Cargo.toml.orig is not kept; compare against the published
# crate on crates.io for the upstream manifest.

[package]
edition = "2024"
name = "iced_fonts"
version = "0.3.0"
authors = ["Redhawk18"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Signex stub of iced_fonts: no fonts embedded, kept only so iced_aw resolves"
homepage = "https://iced.rs"
readme = "README.md"
keywords = [
    "gui",
    "iced",
    "fonts",
]
categories = ["gui"]
license = "MIT"
repository = "https://github.com/Redhawk18/iced_fonts"

[package.metadata.docs.rs]
all-features = true

[features]
advanced_text = ["iced_fonts_macros/advanced_text"]
default = []

[lib]
name = "iced_fonts"
path = "src/lib.rs"


[dependencies.iced_core]
version = "0.15.0-dev"

[dependencies.iced_fonts_macros]
version = "0.3.0"

[dependencies.iced_widget]
version = "0.15.0-dev"

