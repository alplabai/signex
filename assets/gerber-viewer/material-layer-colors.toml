# Default Gerber layer-slot palette.
# These are Material Design colors and are intentionally independent of the GUI theme.
# The source palette supplies the picker swatches, slot order, and HSL matching inputs.
# Distance = sqrt((circular hue delta / 180 * average saturation)^2
#               + saturation delta^2 + lightness delta^2).

version = 1
color_space = "hsl"
palette_sources = [
  "https://m2.material.io/guidelines/style/color.html",
  "https://materialui.co/colors",
  "https://htmlcolorcodes.com/color-chart/material-design-color-chart/",
  "https://www.materialpalette.com/colors",
]

# Material Grey 600, selected by HSL distance from the source negative-object color.
negative_ghost_color = "#757575"

# Material Grey 600, selected by HSL distance from the source grid color.
grid_color = "#757575"

# Material Grey 50, selected by HSL distance from the source D-code color.
d_code_color = "#FAFAFA"

# Deterministic Material colors used only for multi-layer comparison.
compare_colors = [
  "#D32F2F", # Material Red 700
  "#00BCD4", # Material Cyan 500
  "#4CAF50", # Material Green 500
  "#FFC107", # Material Amber 500
  "#9C27B0", # Material Purple 500
  "#2196F3", # Material Blue 500
]

# Complete 2014 Material Design palette used by the Gerber color pickers.
# Each family is presented as one row in this order.
