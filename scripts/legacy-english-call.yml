# Rules for scripts/check_legacy_english.sh (#2326 M2, #2644): a call of one
# of the two constructors of app-authored English with no catalog id yet. The
# path may be qualified (`signex_commands::CommandOutcome::disabled`).
id: command-outcome-disabled
language: rust
rule:
  kind: call_expression
  has:
    field: function
    regex: "(^|::)CommandOutcome::disabled$"
---
id: translatable-legacy-english
language: rust
rule:
  kind: call_expression
  has:
    field: function
    regex: "(^|::)Translatable::legacy_english$"
