# Every new id is a UUID v7; see CONTRIBUTING.md, "Object ids". A dependency
# (tantivy) turns on uuid's `v4` feature, so this lint is the guard.
# `allow-invalid` because builds without that dependency leave uuid's `v4`
# feature off and the path does not resolve.
#
# File dialogs, browsers and launched processes go through signex-app's
# `io_ports` (#1931), which a headless run answers or refuses. Only
# `io_ports/native.rs` and a few named tool spawns carry an `allow` with a
# reason. `allow-invalid` where a path may not resolve in every build.
# scripts/check_io_ports.sh is the second layer.
#
# UI text goes through the house widgets in `signex_widgets` (#2056): their
# labels are a `Localized`, a `UserText` or `raw("…")`, so no literal skips the
# message catalog unnoticed. Only `signex-widgets/src/house.rs` calls the iced
# functions, under an `allow` with a reason; scripts/check_raw_labels.sh counts
# the `raw` call sites and the count may only go down.
disallowed-methods = [
    { path = "iced::widget::text", reason = "use signex_widgets::text, which takes a Localized, a UserText or raw(\"…\") (#2056)" },
    { path = "iced::widget::button", reason = "use signex_widgets::button, whose content is a widget built from signex_widgets::text (#2056)" },
    { path = "iced::widget::text_input", reason = "use signex_widgets::text_input, which takes a Localized, a UserText or raw(\"…\") placeholder (#2056)" },
    { path = "iced::widget::checkbox", reason = "use signex_widgets::checkbox and CheckboxLabel::labelled (#2056)" },
    { path = "iced::widget::tooltip", reason = "use signex_widgets::tooltip, whose tip is a widget built from signex_widgets::text (#2056)" },
    { path = "iced::advanced::widget::text::Text::new", reason = "use signex_widgets::text (#2056)" },
    { path = "iced::widget::Button::new", reason = "use signex_widgets::button (#2056)" },
    { path = "iced::widget::TextInput::new", reason = "use signex_widgets::text_input (#2056)" },
    { path = "iced::widget::Checkbox::new", reason = "use signex_widgets::checkbox (#2056)" },
    { path = "iced::widget::Checkbox::label", reason = "use signex_widgets::CheckboxLabel::labelled (#2056)" },
    { path = "iced::widget::Tooltip::new", reason = "use signex_widgets::tooltip (#2056)" },
    { path = "uuid::Uuid::new_v4", reason = "ids are UUID v7: use Uuid::now_v7 (CONTRIBUTING.md, \"Object ids\")", allow-invalid = true },
    { path = "std::process::Command::new", reason = "launch through crate::io_ports::Opener (#1931); a needed tool spawn carries an allow with its reason" },
    { path = "tokio::process::Command::new", reason = "launch through crate::io_ports::Opener (#1931)", allow-invalid = true },
    { path = "webbrowser::open", reason = "open links through crate::io_ports::Opener (#1931)" },
    { path = "webbrowser::open_browser", reason = "open links through crate::io_ports::Opener (#1931)" },
    { path = "webbrowser::open_browser_with_options", reason = "open links through crate::io_ports::Opener (#1931)" },
]
disallowed-types = [
    { path = "rfd::AsyncFileDialog", reason = "ask through crate::io_ports::Picker (#1931)", allow-invalid = true },
    { path = "rfd::FileDialog", reason = "ask through crate::io_ports::Picker (#1931)", allow-invalid = true },
    { path = "rfd::AsyncMessageDialog", reason = "ask through crate::io_ports (#1931)", allow-invalid = true },
    { path = "rfd::MessageDialog", reason = "ask through crate::io_ports (#1931)", allow-invalid = true },
]
