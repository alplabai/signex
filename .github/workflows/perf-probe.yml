# Temporary: runs the busy-sheet perf probe. Not for merge.
name: perf probe
on:
  push:
    branches: [perf/busy-sheet-probe, perf/probe-2078]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps
        with:
          packages: >-
            libxkbcommon-dev libwayland-dev libvulkan-dev
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            mesa-vulkan-drivers
      - name: Probe
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          set -o pipefail
          nproc; free -m
          # inert.rs tests use `()` as renderer, which only exists with debug assertions.
          perl -0pi -e 's/#\[cfg\(test\)\]\nmod tests \{/#[cfg(any())]\nmod tests {/' crates/signex-app/src/library/editor/inert.rs
          grep -n "cfg(any())" crates/signex-app/src/library/editor/inert.rs
          cargo test --release -p signex-app --lib pan_reuse -- --nocapture --test-threads=1 2>&1 | tee pan.log || true
          echo skip-bench
          grep -E "test |panicked|differ|offset|centre|pixels|class|bbox|wire|selection|paper|background|other" pan.log >> "$GITHUB_STEP_SUMMARY" || true
          
