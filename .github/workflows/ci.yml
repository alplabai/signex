# SPDX-License-Identifier: FSL-1.1-ALv2
#
# Primary PR gate for the signex workspace: compile, test, format, and
# the license/dependency audit. Runs on every PR + push to main / trunk.
# Job names use the org's `<check> · <detail>` convention so they read
# cleanly as required status-check contexts under branch protection.

name: ci

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]
    # The default three, plus ready_for_review: marking a draft ready is what
    # starts its first full build (drafts skip the Rust jobs, see `changes`).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI build-time settings. Neither changes what is tested, only how fast the
  # test binaries get built.
  #
  # Debug builds carry full debuginfo by default. CI never attaches a
  # debugger, and full debuginfo makes every link slower (each integration-test
  # binary is linked on its own) and the rust-cache archive bigger, so it also
  # slows the cache restore and save. `line-tables-only` keeps file:line in
  # panic backtraces, which is all a CI failure needs.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # On Windows, MSVC `link.exe` made the test build take 10m16s against 3m52s
  # on Linux. rust-lld ships with the toolchain and is much faster at linking.
  # Cargo reads this variable only when building for this target, so Linux and
  # macOS ignore it.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

jobs:
  # Decides whether this run needs the Rust jobs (compile, clippy, test,
  # postgres). A draft PR skips them, and so does a PR that only touches
  # prose; the lint job and the `ci · required` aggregator always run. Push,
  # merge-queue and manual runs always build, so trunk is never merged
  # untested, and a draft cannot be merged at all. The decision and its
  # controls: scripts/ci_build_needed.sh.
  changes:
    name: changes · build needed?
    runs-on: ubuntu-latest
    # pull-requests: read for the live draft lookup below.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      library_server: ${{ steps.decide.outputs.library_server }}
      routing_corpus: ${{ steps.decide.outputs.routing_corpus }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          CI_EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The draft flag is read live, not from the event payload: a push
          # and "Ready for review" seconds apart left only the push's run,
          # whose payload still said draft, so the ready PR got a green
          # `ci · required` with no build. A failed lookup leaves CI_DRAFT
          # empty, which builds.
          CI_DRAFT=""
          if [ -n "$PR_NUMBER" ]; then
            CI_DRAFT=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || CI_DRAFT=""
          fi
          export CI_DRAFT
          echo "Draft (live): ${CI_DRAFT:-unknown}"
          # Only a PR has a base to diff against. --no-renames: a move out of
          # crates/ must list the deleted path too, or `crates/x.rs ->
          # docs/x.rs` would look like prose.
          build=$(
            if [ -n "$BASE_SHA" ]; then
              git diff --no-renames --name-only "$BASE_SHA"...HEAD
            fi | bash scripts/ci_build_needed.sh
          )
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Rust jobs needed: $build"
          # The postgres job (#2156) runs on a PR only when its inputs change:
          # the library server, the crates it builds on, the toolchain and
          # this file. Pushes and manual runs (no base) always run it.
          library_server=true
          if [ -n "$BASE_SHA" ]; then
            if git diff --no-renames --name-only "$BASE_SHA"...HEAD | grep -qE '^(crates/signex-library-server/|crates/signex-library/|crates/signex-sketch/|crates/signex-types/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then
              library_server=true
            else
              library_server=false
            fi
          fi
          echo "library_server=$library_server" >> "$GITHUB_OUTPUT"
          # The routing corpus (#2481) is fetched from Git LFS and load-checked
          # on a PR only when its inputs change: the boards, the format and
          # geometry crates that read them, the routing tests, and the files
          # that fetch it. Pushes, the merge queue and manual runs always do.
          routing_corpus=true
          if [ -n "$BASE_SHA" ]; then
            if git diff --no-renames --name-only "$BASE_SHA"...HEAD | grep -qE '^(testdata/routing-corpus/|crates/signex-types/|crates/pcb-geom/|crates/signex-engine/tests/routing/|scripts/check_routing_corpus\.sh$|\.gitattributes$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then
              routing_corpus=true
            else
              routing_corpus=false
            fi
          fi
          echo "routing_corpus=$routing_corpus" >> "$GITHUB_OUTPUT"
          echo "Routing corpus fetched and load-checked: $routing_corpus"
          echo "Postgres job needed: $library_server"

  check:
    name: check · ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@1.97.0 # keep in lockstep with rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2

      # Cached .deb downloads; see the action for why.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          packages: >-
            libxkbcommon-dev libwayland-dev libvulkan-dev
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Check
        run: cargo check --workspace

      # signex-mcad does no IO and must build for a web front end (#2487,
      # docs/ROADMAP.md "MCAD (P3)"). `rustup` inside the repo adds the
      # target to the toolchain rust-toolchain.toml pins.
      - name: Build signex-mcad for wasm32
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p signex-mcad --target wasm32-unknown-unknown

      # No `-W clippy::all`. `clippy::all` is already the default lint set, so
      # the flag bought nothing — but a *group-level* `-W` sets every lint in
      # the group to warn, and that group contains the 67 deny-by-default
      # `correctness` lints. It turned every one of them from a build failure
      # into an annotation, i.e. it made this step weaker than no flag at all
      # (#567). `--all-targets` reaches `tests/`, `benches/`, `examples/` and
      # inline `#[cfg(test)] mod tests` — bare `cargo clippy` compiles the lib
      # without `cfg(test)`, so those bodies were never even parsed as live
      # code. `--all-features` reaches signex-library's `local-git`,
      # `database`, `search-tantivy`, `distributors-community` and `ai-stub`
      # modules.
      #
      # `-- -D warnings` (#539) is what keeps the count at zero. Getting there
      # took #587 (217 machine-applicable), #588 (111 that needed a decision)
      # and #589 (16 `dead_code`) off a backlog of 344; without a gate the
      # next 344 accumulate the same way, one "just a warning" at a time.
      # It denies warn-level lints in workspace code only — dependencies are
      # built with `--cap-lints allow`, and cargo's own future-incompat notice
      # for `block v0.1.6` is not a rustc lint, so neither fails the step.
      #
      # The cost: a toolchain bump that introduces a new lint turns this red
      # on whichever PR happens to bump it. That is deliberate and contained —
      # `rust-toolchain.toml` pins 1.97.0, so new lints only ever arrive in a
      # PR that changes that pin, never in an unrelated one.
      #
      # Silencing a lint to get green defeats the point. Fix the code; if a
      # lint genuinely cannot be satisfied, `#[expect(lint, reason = "…")]`
      # with a real reason is the escape hatch, and it has to survive review.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # vendor/iced_aw is excluded from the workspace, so the step above never
      # lints it, and cargo applies `-- -D warnings` to workspace members only.
      # Its own `[lints]` table (vendor/iced_aw/Cargo.toml) denies every rustc
      # and clippy warning, so this plain run fails on any warning and shares
      # the build cache. No --all-features: cargo rejects feature flags for a
      # package outside the workspace, so the default set (`full`) is linted.
      - name: Clippy (vendored iced_aw)
        run: cargo clippy -p iced_aw --all-targets

  test:
    name: test · workspace
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      # No lfs here: the routing corpus (#2481, ~90 MiB in Git LFS) is fetched
      # below only when `changes` says its inputs moved, and from a cache of
      # .git/lfs keyed on the boards' LFS object ids, so an unchanged corpus
      # costs no LFS bandwidth.
      - uses: actions/checkout@v5
        with:
          submodules: false

      # The key is a hash of the boards' LFS object ids (read from the pointer
      # files in the checkout), so it changes exactly when a board does.
      - name: Hash the routing corpus LFS objects
        id: corpus_lfs
        if: needs.changes.outputs.routing_corpus == 'true'
        run: |
          set -o pipefail
          hash=$(git lfs ls-files --long --include 'testdata/routing-corpus/**' | cut -d ' ' -f1 | sort | sha256sum | cut -d ' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the routing corpus LFS cache
        if: needs.changes.outputs.routing_corpus == 'true'
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: routing-corpus-lfs-${{ steps.corpus_lfs.outputs.hash }}

      # With the cache warm this only checks the objects out; with it cold
      # it downloads them once for the key. SIGNEX_REQUIRE_ROUTING_CORPUS
      # makes the load check fail on a pointer left unfetched or an empty
      # corpus instead of skipping it.
      - name: Fetch the routing corpus
        if: needs.changes.outputs.routing_corpus == 'true'
        run: |
          git lfs pull --include 'testdata/routing-corpus/**'
          echo "SIGNEX_REQUIRE_ROUTING_CORPUS=1" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.97.0 # keep in lockstep with rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary; config and the reason for nextest in .config/nextest.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps
        with:
          packages: >-
            libxkbcommon-dev libwayland-dev libvulkan-dev
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
            mesa-vulkan-drivers

      # signex-gfx's debug_pass smoke tests request a real wgpu adapter and
      # panic if none is found. GitHub's headless runners have no GPU, so we
      # provide lavapipe (mesa-vulkan-drivers, a software Vulkan ICD) above;
      # wgpu picks it up automatically and the tests run on the CPU rasterizer.
      - name: Test
        env:
          # Fail closed: pixel goldens must run strictly on lavapipe, and a
          # missing reference fails the job.
          SIGNEX_REQUIRE_LAVAPIPE: "1"
          # Generation path for a new or changed scene: the rendered frame of a
          # missing reference is written here (never into the source tree) and
          # uploaded below for review and commit.
          SIGNEX_GOLDEN_CANDIDATES: ${{ github.workspace }}/target/golden-candidates
        run: cargo nextest run --workspace --profile ci

      # vendor/iced_aw is excluded from the workspace (a path dependency only),
      # so --workspace never runs its tests (#2206). -p still resolves it.
      - name: Test vendored iced_aw
        run: cargo nextest run -p iced_aw --profile ci

      # nextest does not run doctests.
      - name: Doctest vendored iced_aw
        run: cargo test -p iced_aw --doc

      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --doc

      - name: Upload pixel golden candidates
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pixel-golden-candidates
          path: target/golden-candidates
          if-no-files-found: ignore

  # The same suite on Windows and macOS (#695): `check` compiles the
  # `cfg(windows)` / macOS code, but only this job runs it. A separate job,
  # not a matrix on `test`, because only Linux needs the apt packages and the
  # lavapipe env. The GPU smoke tests get WARP (DX12) on Windows and the
  # runner's Metal device on macOS; no extra install.
  # Skipped in the merge queue. It has never been a required check, so the
  # queue merged without waiting for it there either: it never kept a break
  # out of trunk, it only named the group that caused one. The trunk push run
  # tests the merged tree. A burst of merges cancels all but the last push run
  # (one concurrency group per ref), and that last run tests the tip, which
  # holds every merge of the burst. What the skip gives up is which merge
  # broke it, found with one bisect. What it saves is two runner slots, one
  # of them macOS (5 org-wide), per queued PR.
  test-os:
    name: test · ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.build == 'true' && github.event_name != 'merge_group'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@1.97.0 # keep in lockstep with rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary; config and the reason for nextest in .config/nextest.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --workspace --profile ci

      - name: Doctests
        run: cargo test --workspace --doc

  # Library-server Postgres integration test (#113). Non-required: the
  # default `cargo test --workspace` stays hermetic (SQLite); this job
  # exercises the Postgres migrations against a real server. The test is
  # `#[ignore]`d without the URL, hence `--ignored`. Throwaway CI-only
  # credentials on a job-local service container; no secrets.
  # Skipped in the merge queue for the same reason as `test-os`.
  library-server-pg:
    name: test · library-server postgres
    needs: changes
    if: needs.changes.outputs.build == 'true' && needs.changes.outputs.library_server == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: signex
          POSTGRES_PASSWORD: signex
          POSTGRES_DB: signex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signex -d signex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIGNEX_TEST_PG_URL: postgres://signex:signex@localhost:5432/signex_test
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.97.0 # keep in lockstep with rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2

      - name: Test (postgres)
        run: cargo test -p signex-library-server --test integration_db -- --ignored

  # Every repo-level gate that needs no compile, as steps of ONE job. Each
  # was a separate job, and on the org's 20-concurrent-job plan every one
  # queued for its own runner slot to do a few seconds of work.
  # `if: !cancelled()` on each step keeps reporting every failing gate, not
  # just the first.
  lint:
    name: lint · repo gates
    runs-on: ubuntu-latest
    # pull-requests: read for the live PR-title lookup in the fragment gate.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.97.0 # keep in lockstep with rust-toolchain.toml
        with:
          components: rustfmt

      # Prebuilt binary; `cargo install` compiled it from source every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Path-filter controls
        if: ${{ !cancelled() }}
        run: bash scripts/test_ci_build_needed.sh

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Check licenses
        if: ${{ !cancelled() }}
        run: cargo deny --all-features check licenses

      - name: Check sources
        if: ${{ !cancelled() }}
        run: cargo deny --all-features check sources
        continue-on-error: true

      # Advisories are informational, not a merge gate: they fire on newly
      # published RUSTSEC entries against the shared Cargo.lock (mostly
      # transitive GUI-stack crates like ttf-parser / rustybuzz pinned deep
      # in iced/winit) with no code change on our side. Surface them as an
      # annotation; criticals are addressed by a human, not by blocking CI.
      # (deny.toml documents this same intent; `licenses` above stays hard.)
      - name: Check advisories
        if: ${{ !cancelled() }}
        run: cargo deny --all-features check advisories
        continue-on-error: true

      # `[bans]` in deny.toml (the glyphon regression ban; duplicate
      # versions at "warn") was configured but never evaluated, because only
      # the three checks above ran (#664). Hard: a banned crate fails the job.
      - name: Check bans
        if: ${{ !cancelled() }}
        run: cargo deny --all-features check bans

      # ADR-0001 D5 (#664): workspace dependency edges are an allow-list in
      # scripts/arch-edges.txt, and domain crates may not depend on the
      # UI/GPU stack. Rules and rationale live in the script.
      - name: Architecture guard
        if: ${{ !cancelled() }}
        run: bash scripts/check_arch_guard.sh

      - name: Architecture guard controls
        if: ${{ !cancelled() }}
        run: bash scripts/test_check_arch_guard.sh

      # ADR-0006 (#2326): app/core/ names no crate:: path outside the core,
      # no iced, tokio, blocking helpers or std::fs/thread/process. Rules
      # and blind spots live in the script.
      - name: Core guard
        if: ${{ !cancelled() }}
        run: bash scripts/check_core_guard.sh

      - name: Core guard controls
        if: ${{ !cancelled() }}
        run: bash scripts/test_check_core_guard.sh

      # Layering ratchet (#664): SymbolTransform / union-find copies outside
      # their crate and app imports of library-editor internals may not grow,
      # and the baseline is regenerated when they shrink. Rules live in
      # scripts/check_layer_ratchet.sh.
      - name: Layer ratchet
        if: ${{ !cancelled() }}
        run: bash scripts/check_layer_ratchet.sh

      - name: Layer ratchet controls
        if: ${{ !cancelled() }}
        run: bash scripts/test_check_layer_ratchet.sh

      # Hard gate (NOT continue-on-error): a PR may not add a new production
      # god-file or grow a grandfathered one. Ratchet + rationale live in
      # scripts/check_file_size.sh; the slice model it points to is ADR-0001.
      - name: God-file ratchet gate
        if: ${{ !cancelled() }}
        run: bash scripts/check_file_size.sh

      # Hard gate (#2056): UI text goes through the house widgets, and `raw("…")`
      # is the escape hatch for text not in the message catalog yet. The count
      # of raw call sites may not grow (scripts/check_raw_labels.sh); clippy's
      # `disallowed-methods` (clippy.toml) bans the raw iced widget functions.
      - name: Raw-label ratchet
        if: ${{ !cancelled() }}
        run: bash scripts/check_raw_labels.sh

      - name: Raw-label ratchet controls
        if: ${{ !cancelled() }}
        run: bash scripts/test_check_raw_labels.sh

      # This step fails hard (NOT continue-on-error) on a violation, and
      # `ci · required` gates the merge on this job, so a violation actually
      # blocks it (GH #548 proposal 2).
      #
      # Scope, corrected (#548): `let _ = self.handle_x(...)` silently drops
      # an `iced::Task<Message>` and rustc does NOT catch it — binding to `_`
      # counts as "used" under `unused_must_use`. That shape is this gate's
      # entire reason to exist. The neighbouring `self.handle_x(...)?;` shape
      # is the COMPILER's job, not this script's: `unused_must_use` is denied
      # for signex-app in crates/signex-app/Cargo.toml, so it fails the build.
      # An earlier version of this comment claimed the compiler was blind to
      # both. It never was blind to the second one — the warning was simply
      # buried among ~324 unrelated workspace warnings and nobody read it.
      #
      # Rationale + known blind spots live in
      # scripts/check_discarded_tasks.sh; GH #99 part 1.
      - name: Discarded-Task ratchet gate
        if: ${{ !cancelled() }}
        run: bash scripts/check_discarded_tasks.sh

      - name: Discarded-Task gate controls
        if: ${{ !cancelled() }}
        run: bash scripts/test_check_discarded_tasks.sh

      # Only the native adapter (crates/signex-app/src/io_ports/native.rs) may
      # open a file dialog, a browser or a launcher; a headless run answers
      # dialogs from arguments and refuses launches (#1931). Hard gate.
      - name: Native-side-effect gate
        if: ${{ !cancelled() }}
        run: bash scripts/check_io_ports.sh

      - name: Native-side-effect gate controls
        if: ${{ !cancelled() }}
        run: bash scripts/test_check_io_ports.sh

      # The engine takes new object ids from the caller (#2429, ADR-0006);
      # Uuid::now_v7 / new_v4 in signex-engine production code only at the
      # sites in scripts/engine-ids-allowlist.txt, which may only shrink. Hard gate.
      - name: Engine id gate
        if: ${{ !cancelled() }}
        run: bash scripts/check_engine_ids.sh

      - name: Engine id gate controls
        if: ${{ !cancelled() }}
        run: bash scripts/test_check_engine_ids.sh

      # Structural lint rules (sgconfig.yml, ast-grep/rules): shapes a text
      # grep cannot see, e.g. a discarded Task wrapped over several lines.
      # Hard gate. Run it locally with
      #   ast-grep test --skip-snapshot-tests && ast-grep scan --error
      # A true false positive takes `// ast-grep-ignore: <rule-id>` with the
      # reason on the line above; narrow the rule first if you can.
      - name: Install ast-grep
        id: install-ast-grep
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: ast-grep@0.51.1

      # Skipped when the install failed: that step has already failed the job.
      - name: ast-grep rules
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        # --error: the third-party rules ship as `warning`, which alone
        # would never fail the step.
        run: |
          ast-grep test --skip-snapshot-tests
          ast-grep scan --error

      # Command ids may be added, never silently removed (#2447): every id in
      # scripts/catalog-ids.txt must still be a CommandMetadata row in the
      # catalog, and every catalog id must be listed. Hard gate.
      - name: Command-id gate
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/check_catalog_ids.sh

      - name: Command-id gate controls
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/test_check_catalog_ids.sh

      # Core-bound state stays UI-free (#2494, ADR-0006): fields of the structs in
      # scripts/uifree-state.txt with a UI or unlisted signex-app type may only
      # get fewer, and a listed UI-free module imports nothing outside the
      # allowlist. Rules and blind spots live in the script. Hard gate.
      - name: UI-free state ratchet
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/check_uifree_state.sh

      - name: UI-free state ratchet controls
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/test_check_uifree_state.sh

      # Every app/core/ type is reachable from DocumentState or a port type in
      # scripts/core-closure-roots.txt (#2326, ADR-0006 H7); the baseline of
      # unreachable types may only shrink. Needs ast-grep, so it runs after the
      # install. Rules and blind spots live in the script. Hard gate.
      - name: Core closure guard
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/check_core_closure.sh

      - name: Core closure guard controls
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/test_check_core_closure.sh

      # App-authored English with no catalog id (#2326 M2, #2644): calls of
      # `CommandOutcome::disabled` and `Translatable::legacy_english` may only
      # get fewer. Rules and blind spots live in the script. Hard gate.
      - name: Legacy-English ratchet
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/check_legacy_english.sh

      - name: Legacy-English ratchet controls
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/test_check_legacy_english.sh

      # The edit-tail seam (#2326 M5, M6): only the tail wrappers call the core
      # half in app/state/sheet_change/, and it names no GUI state and not the
      # diagnostics log. Rules and blind spots live in the script. Hard gate.
      - name: Sheet-change seam guard
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/check_sheet_change_seam.sh

      - name: Sheet-change seam guard controls
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/test_check_sheet_change_seam.sh

      # The load seam (#2326 slice 3, #2704): only the load wrappers call the
      # core half in app/state/document_load/, which names no GUI state, takes
      # no closure and removes an engine in one place. Rules and blind spots
      # live in the script. Hard gate.
      - name: Load seam guard
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/check_document_load_seam.sh

      - name: Load seam guard controls
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/test_check_document_load_seam.sh

      # Command operands run only through the entries in app/command and the
      # agent route (#2731): zero production calls elsewhere in signex-app.
      # Rules and blind spots live in the script. Hard gate.
      - name: Command entry ratchet
        if: ${{ !cancelled() }}
        run: bash scripts/check_command_entry.sh

      - name: Command entry ratchet controls
        if: ${{ !cancelled() }}
        run: bash scripts/test_check_command_entry.sh

      # A panic in the app must not leave a value taken out (#2651, ADR-0006):
      # production catch_unwind calls under crates/signex-app/src/app may only
      # get fewer. Rules and blind spots live in the script. Hard gate.
      - name: catch_unwind ratchet
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/check_app_catch_unwind.sh

      - name: catch_unwind ratchet controls
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/test_check_app_catch_unwind.sh

      # The projector draws documents and writes none (#2326 slice 3, #2705):
      # no core-state write and no wrapper call under app/projector.
      # Rules and blind spots live in the script. Hard gate.
      - name: Projector write guard
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/check_projector_writes.sh

      - name: Projector write guard controls
        if: ${{ !cancelled() && steps.install-ast-grep.outcome == 'success' }}
        run: bash scripts/test_check_projector_writes.sh

      # `signex-app` cannot say `[lints] workspace = true` — cargo rejects
      # mixing inheritance with per-lint overrides, and that crate carries its
      # own `[lints.clippy] let_underscore_must_use` that the workspace
      # deliberately does not. So it re-declares the workspace lints by hand,
      # and until now nothing checked that copy: a lint added to
      # `[workspace.lints.rust]` silently skipped the largest crate in the
      # repo, with no error and no warning (GH #570).
      #
      # This step fails hard (NOT continue-on-error); like every hard step in
      # this job it blocks the merge through `ci · required`.
      - name: Lint-lockstep gate
        if: ${{ !cancelled() }}
        run: bash scripts/check_lint_lockstep.sh

      # The routing corpus (#2481) holds third-party boards: every board has
      # a manifest row with an allowed licence and its licence text, and
      # every row a board. Rules: testdata/routing-corpus/README.md.
      - name: Routing corpus gate
        if: ${{ !cancelled() }}
        run: bash scripts/check_routing_corpus.sh

      - name: Routing corpus gate controls
        if: ${{ !cancelled() }}
        run: bash scripts/test_check_routing_corpus.sh

      # Fragment names/bodies are validated on every event (PR, merge queue,
      # push). Rule + rationale: changelog.d/README.md (GH #748).
      - name: Validate fragments
        if: ${{ !cancelled() }}
        run: |
          bash scripts/changelog_assemble.sh --check
          bash scripts/test_changelog_assemble.sh

      # PR-only, feature PRs into trunk only (trunk -> main promotion and the
      # merge queue are exempt). CHANGELOG.md is edited directly only by
      # same-repo release PRs (head `chore/release-*` or `release/*`, the shape
      # every release prep PR has used); forks cannot self-exempt.
      # Branch/title go through env, never inline-interpolated into the script.
      - name: CHANGELOG.md must not be edited directly
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'trunk' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$IS_SAME_REPO" = true ]; then
            case "$HEAD_REF" in
              chore/release-* | release/*)
                echo "release PR ($HEAD_REF): CHANGELOG.md edits allowed"
                exit 0
                ;;
            esac
          fi
          git fetch --no-tags origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF...HEAD" | awk '$0 == "CHANGELOG.md" {f=1} END {exit !f}'; then
            echo "::error file=CHANGELOG.md::Do not edit CHANGELOG.md in a PR. Add a fragment changelog.d/<number>.<section>.md instead (see changelog.d/README.md)."
            exit 1
          fi

      # A feat/fix/perf PR into trunk must add a fragment. The title type is
      # the declaration: a change that is not user-visible takes another type
      # (chore, refactor, test, ci, docs). The title is read live, because
      # `edited` does not trigger this workflow: after a retitle, re-running
      # this job sees the new title (the event payload would keep the old one).
      - name: Require a fragment on feat/fix/perf PRs
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'trunk' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PAYLOAD_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_TITLE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title) || PR_TITLE="$PAYLOAD_TITLE"
          echo "PR title (live): $PR_TITLE"
          if printf '%s' "$PR_TITLE" | awk '/^(feat|fix|perf)(\([^)]*\))?!?:/{f=1} END{exit !f}'; then
            git fetch --no-tags origin "$BASE_REF"
            if ! git diff --no-renames --name-only --diff-filter=A "origin/$BASE_REF...HEAD" |
              awk '/^changelog\.d\/[0-9]+\..+\.md$/{f=1} END{exit !f}'; then
              echo "::error title=No changelog fragment::feat/fix/perf PR adds no changelog.d/<number>.<section>.md fragment. Add one, or retitle with a type that is not user-visible (chore, refactor, test, ci, docs) and re-run this job."
              exit 1
            fi
          fi

  # The ONE status context branch protection requires from this workflow.
  # Adding, renaming or path-gating a job here never needs a ruleset edit:
  # list it under `needs` and this job decides. A Rust job counts as passed
  # when it succeeded, or when `changes` succeeded and skipped it on purpose.
  required:
    name: ci · required
    if: always()
    # test-os and library-server-pg stay out on purpose: neither has ever
    # been a required check.
    needs: [changes, check, test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped by the path filter
        env:
          NEEDS: ${{ toJSON(needs) }}
          BUILD: ${{ needs.changes.outputs.build }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r --arg build "$BUILD" '
            to_entries[]
            | select(
                (.value.result == "success" | not)
                and ((.value.result == "skipped" and $build == "false"
                      and .key != "changes" and .key != "lint") | not)
              )
            | .key')
          if [ -n "$bad" ]; then
            echo "::error::Required jobs did not pass: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
