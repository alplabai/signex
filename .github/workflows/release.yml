name: Release

on:
  push:
    tags:
      # Strict semver only. A bare "v*" also matches checkpoint tags like
      # v0.11-pre-library-restore-2026-04-29, which are snapshots rather
      # than releases — they fired a full cross-platform release build and
      # tried to publish a GitHub Release off a CHANGELOG section that does
      # not exist. Keep snapshot tags outside this pattern.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # pre-releases: v1.0.0-rc.1
  # Dry run: build + sign (+ notarize when the secrets exist) from any branch
  # and upload the results as workflow artifacts. Never publishes a Release.
  # See docs/RELEASE_SIGNING.md.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build/sign/notarize, upload workflow artifacts, no Release). Must stay true; releases come from tags."
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Single source of the version string for every job below. A tag push uses
  # the tag; a dry run uses the workspace version so the smoke tests (which
  # compare `--version` with this string) still pass.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          persist-credentials: false
      - id: v
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            DRY=false
          else
            if [[ "$DRY_RUN_INPUT" != "true" ]]; then
              echo "::error::workflow_dispatch is dry-run only; publish by pushing a tag"
              exit 1
            fi
            VERSION="$(awk '/^\[workspace.package\]/{f=1;next} f&&/^version *=/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
            [[ -n "$VERSION" ]] || { echo "::error::cannot read workspace version"; exit 1; }
            TAG="v$VERSION"
            DRY=true
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "dry_run=$DRY"
          } >> "$GITHUB_OUTPUT"

  verify-version:
    name: Verify tag, Cargo.toml and CHANGELOG agree
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Check release version consistency
        run: bash scripts/check_release_version.sh "$GITHUB_REF"

  # Never publish binaries from a SHA whose tests fail (#113): the same
  # `cargo test --workspace` that gates trunk in ci.yml, run on the tag.
  test:
    name: Test (workspace)
    needs: verify-version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Read-only: dependency build.rs scripts run here and must not hold a
    # write token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.0 # keep in lockstep with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # apt list + toolchain pin mirror ci.yml's `test · workspace` job; keep in sync.
      - name: Install Linux dependencies
        run: |
          sudo grep -rlZ 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -0 -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            mesa-vulkan-drivers
      - name: Test
        run: cargo test --workspace

  # Compiles with cargo (so every dependency build.rs runs here) and holds NO
  # signing material. Windows/macOS legs only hand the unsigned binary to the
  # package-* jobs below; the Linux leg packages and uploads as before.
  build:
    name: Build (${{ matrix.target }})
    needs: [version, verify-version, test]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped') && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: x64
            arch_suffix: x86_64

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            arch: arm64
            arch_suffix: aarch64

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch: amd64
            arch_suffix: x86_64

          # Native arm64 build on GitHub's hosted Linux arm64 runner (free
          # for public repos). Not cross-compiled: iced + wgpu pull in
          # native C/C++ deps that are far simpler to build on-arch. The
          # Linux steps below are fully matrix-driven: `arch` (Debian
          # naming) feeds the .deb, `arch_suffix` the AppImage, the
          # appimagetool download and the tarball.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            arch: arm64
            arch_suffix: aarch64

          # One universal (arm64 + x86_64) binary built on a single
          # Apple Silicon runner: both slices are cross-built by the Xcode
          # toolchain and joined with `lipo`. Rosetta 2 only translates
          # x86_64 -> arm64, so an arm64-only build cannot run on an Intel
          # Mac; a second macos-13 row is avoided because that queue is
          # deprecated and takes 30+ minutes to pick up a job.
          # `target` is a label here (job/artifact name); `rust_targets`
          # is what rustup installs and cargo builds.
          - target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            os: macos-14
            arch: universal
            arch_suffix: universal

          # macos-latest was stalling on v0.6.2 (set-up job failed in 2s
          # — queue exhausted). Pinned to macos-14 (Apple Silicon) for
          # stable capacity. Bump to macos-15 when macos-14 rolls off.

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Resolve version
        id: version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@1.97.0 # keep in lockstep with rust-toolchain.toml
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Both macOS slices live under target/<triple>/; cache each.
          cache-targets: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # Drop the packages.microsoft.com apt sources so a broken InRelease
          # there can't fail `apt-get update` under `set -e`. All packages
          # below come from the Ubuntu archive.
          sudo grep -rlZ 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -0 -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            desktop-file-utils fakeroot

      - name: Build release binary
        if: runner.os != 'macOS'
        run: cargo build --release --target ${{ matrix.target }} -p signex-app

      # ─── macOS: two slices -> one universal binary ────────────────
      - name: Build macOS slices and lipo into a universal binary
        if: runner.os == 'macOS'
        run: |
          # Floor matches LSMinimumSystemVersion in installer/macos/Info.plist
          # so the cc-built C/C++ deps (wgpu/iced) and the x86_64 slice
          # target the same minimum macOS.
          export MACOSX_DEPLOYMENT_TARGET=11.0
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t" -p signex-app
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/signex \
            target/aarch64-apple-darwin/release/signex \
            target/x86_64-apple-darwin/release/signex
          archs="$(lipo -archs target/universal-apple-darwin/release/signex)"
          echo "universal binary archs: $archs"
          for a in x86_64 arm64; do
            [[ " $archs " == *" $a "* ]] || { echo "::error::missing $a slice in universal binary"; exit 1; }
          done

      # ─── Windows / macOS: hand the unsigned binary to package-* ───
      - name: Upload unsigned binary
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unsigned-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/signex${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      # ─── Linux: .deb package ──────────────────────────────────────
      - name: Build Linux .deb package
        if: runner.os == 'Linux'
        run: |
          chmod +x installer/linux/build-deb.sh
          ./installer/linux/build-deb.sh \
            "target/${{ matrix.target }}/release/signex" \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.arch }}"

      # ─── Linux: AppImage ──────────────────────────────────────────
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: |
          # Fetch appimagetool so the script can package the AppDir.
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch_suffix }}.AppImage"
          chmod +x appimagetool
          export APPIMAGETOOL="$PWD/appimagetool"
          # appimagetool is itself an AppImage; extract-and-run avoids
          # needing libfuse2 on the runner (absent on ubuntu 24.04 images).
          export APPIMAGE_EXTRACT_AND_RUN=1
          chmod +x installer/linux/build-appimage.sh
          ./installer/linux/build-appimage.sh \
            "target/${{ matrix.target }}/release/signex" \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.arch_suffix }}"

      - name: Package Linux tarball (alongside installer)
        if: runner.os == 'Linux'
        run: |
          mkdir staging
          cp "target/${{ matrix.target }}/release/signex" staging/
          bash installer/copy-font-licenses.sh staging/licenses/fonts
          cd staging
          tar czf "../signex-linux-${{ matrix.arch_suffix }}-${{ steps.version.outputs.version }}.tar.gz" *

      # ─── Smoke-test the artifacts we just built (#342) ───────────
      # Install/run what a tester would receive and assert `--version`
      # equals the tag's version. Any failure fails the leg, so the
      # `release` job (needs: build) never publishes. Runs before upload.
      - name: Smoke-test Linux .deb and AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          # apt (not dpkg -i) resolves the Depends line, as a tester's install does.
          sudo apt-get update -q
          sudo apt-get install -y "./signex_${V}_${{ matrix.arch }}.deb"
          bash scripts/smoke_release_artifact.sh "$V" /usr/bin/signex
          # --appimage-extract-and-run: no FUSE needed on the runner.
          bash scripts/smoke_release_artifact.sh "$V" \
            "./Signex-${V}-${{ matrix.arch_suffix }}.AppImage" --appimage-extract-and-run

      # ─── Upload all artifacts for this target ─────────────────────
      - name: Upload artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signex-${{ matrix.target }}-${{ steps.version.outputs.version }}
          path: |
            signex_${{ steps.version.outputs.version }}_*.deb
            Signex-${{ steps.version.outputs.version }}-*.AppImage
            signex-linux-*-${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error

  # ─── Signing jobs ────────────────────────────────────────────────
  # Isolated from `build`: they run NO cargo and no dependency build scripts,
  # use only pinned first-party actions (checkout / download- / upload-artifact)
  # plus the vendor tools (InnoSetup, signtool, codesign, notarytool), and hold
  # a read-only token. Signing material exists only here, under $RUNNER_TEMP,
  # and the always() steps delete it. Each secret pair is gated: `secrets`
  # cannot be used in step `if:`, so the job env turns "is it set" into
  # 'true'/'false'. With nothing set the packages are built unsigned, as before.
  package-windows:
    name: Package + sign (windows ${{ matrix.arch }})
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.build.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            arch_suffix: x86_64
          - target: aarch64-pc-windows-msvc
            arch: arm64
            arch_suffix: aarch64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
      WIN_PFX_SET: ${{ secrets.WINDOWS_CERT_PFX != '' }}
      WIN_PW_SET: ${{ secrets.WINDOWS_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          persist-credentials: false

      - name: Warn on half-configured Windows signing secrets
        if: env.WIN_PFX_SET != env.WIN_PW_SET
        shell: bash
        run: echo "::warning::Only one of WINDOWS_CERT_PFX / WINDOWS_CERT_PASSWORD is set - building UNSIGNED."

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unsigned-${{ matrix.target }}
          path: bin

      # SIGN_PFX_PATH is exported before anything can fail so the always()
      # cleanup knows what to delete.
      - name: Prepare Windows signing
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signex-codesign.pfx'
          "SIGN_PFX_PATH=$pfx" >> $env:GITHUB_ENV
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $tool) { throw 'signtool.exe not found in the Windows SDK' }
          "SIGNTOOL_PATH=$($tool.FullName)" >> $env:GITHUB_ENV

      - name: Sign signex.exe
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./installer/windows/sign.ps1 bin/signex.exe

      - name: Install InnoSetup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # With a certificate, ISCC calls sign.ps1 (the `signex` SignTool in
      # signex.iss) for the installer AND the uninstaller stub.
      - name: Build Windows installer
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $binary = "$PWD\bin\signex.exe"
          $iscc = @("/DVersion=$env:VERSION", "/DArch=${{ matrix.arch }}", "/DBinary=$binary", "/Q")
          if ($env:HAS_WIN_CERT -eq 'true') {
            $iscc += "/DSign=1"
            $iscc += ('/Ssignex=pwsh -NoProfile -File ' + "$PWD\installer\windows\sign.ps1" + ' $f')
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @iscc installer\windows\signex.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Move-Item installer\windows\signex-setup-${{ matrix.arch_suffix }}-$env:VERSION.exe .

      - name: Verify signed installer
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        run: |
          & $env:SIGNTOOL_PATH verify /pa /v "signex-setup-${{ matrix.arch_suffix }}-$env:VERSION.exe"
          if ($LASTEXITCODE -ne 0) { throw 'installer signature did not verify' }

      # The ZIP copies the exe signed above, so it ships signed.
      - name: Package Windows portable ZIP (alongside installer)
        shell: pwsh
        run: |
          mkdir staging | Out-Null
          Copy-Item bin/signex.exe staging/
          New-Item -ItemType Directory -Force staging/licenses/fonts | Out-Null
          Copy-Item crates/signex-app/assets/fonts/OFL-*.md staging/licenses/fonts/
          Compress-Archive -Path staging/* -DestinationPath "signex-windows-${{ matrix.arch_suffix }}-$env:VERSION.zip"

      # The aarch64 Windows installer cannot execute on the x64 runner,
      # so only the x64 leg is smoke-tested.
      - name: Smoke-test Windows installer
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $v = $env:VERSION
          $dir = Join-Path $env:RUNNER_TEMP "signex-smoke"
          # Per-user install (PrivilegesRequired=lowest); /DIR pins the
          # location so the check does not depend on {autopf} resolution.
          $p = Start-Process -FilePath ".\signex-setup-${{ matrix.arch_suffix }}-$v.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          # signex.exe is a console-subsystem binary, so stdout is capturable.
          $exe = ($dir -replace '\\', '/') + "/signex.exe"
          bash scripts/smoke_release_artifact.sh $v $exe
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }

      # Deletes the fixed path even if "Prepare" died before exporting it.
      - name: Remove Windows signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'signex-codesign.pfx')

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signex-${{ matrix.target }}-${{ needs.version.outputs.version }}
          path: |
            signex-setup-*-${{ needs.version.outputs.version }}.exe
            signex-windows-*-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  package-macos:
    name: Package + sign (macOS)
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.build.result == 'success' }}
    runs-on: macos-14
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH_SUFFIX: universal
      HAS_MAC_CERT: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' }}
      HAS_MAC_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      MAC_P12_SET: ${{ secrets.MACOS_CERT_P12 != '' }}
      MAC_PW_SET: ${{ secrets.MACOS_CERT_PASSWORD != '' }}
      APPLE_ANY_SET: ${{ secrets.APPLE_ID != '' || secrets.APPLE_TEAM_ID != '' || secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          persist-credentials: false

      - name: Warn on half-configured macOS signing secrets
        shell: bash
        run: |
          if [[ "$MAC_P12_SET" != "$MAC_PW_SET" ]]; then
            echo "::warning::Only one of MACOS_CERT_P12 / MACOS_CERT_PASSWORD is set - using the AD-HOC signature."
          fi
          if [[ "$APPLE_ANY_SET" == "true" && "$HAS_MAC_NOTARY" != "true" ]]; then
            echo "::warning::APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD only partly set - NOT notarizing."
          fi
          if [[ "$HAS_MAC_CERT" == "true" && "$HAS_MAC_NOTARY" != "true" ]]; then
            echo "::warning::Developer ID signed but NOT notarized; Gatekeeper will still warn."
          fi

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unsigned-universal-apple-darwin
          path: bin

      # MACOS_KEYCHAIN is exported first so the always() cleanup can delete it
      # even if the import fails halfway. The unlock timeout is short.
      - name: Import macOS signing certificate
        if: env.HAS_MAC_CERT == 'true'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY_SECRET: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set +x
          KEYCHAIN="$RUNNER_TEMP/signex-signing.keychain-db"
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          KEYCHAIN_PW="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PW"
          P12="$RUNNER_TEMP/signex-developer-id.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Apple's Developer ID G2 intermediate, committed in the repo so the
          # chain builds without a network fetch (expires 2031-09-17).
          security import installer/macos/DeveloperIDG2CA.cer -k "$KEYCHAIN" -T /usr/bin/codesign
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$MACOS_SIGN_IDENTITY_SECRET"
          if [[ -z "$IDENTITY" ]]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | awk '/Developer ID Application/ {print $2; exit}')"
          fi
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::no 'Developer ID Application' identity found in MACOS_CERT_P12"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build macOS DMG installer
        shell: bash
        run: |
          chmod +x installer/macos/build-dmg.sh
          ./installer/macos/build-dmg.sh bin/signex "$VERSION" "$ARCH_SUFFIX"

      # Credentials go into the temp keychain once (store-credentials), then
      # notarytool reads them via --keychain-profile.
      - name: Notarize and staple macOS DMG
        if: env.HAS_MAC_CERT == 'true' && env.HAS_MAC_NOTARY == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set +x
          DMG="signex-macos-${ARCH_SUFFIX}-${VERSION}.dmg"
          xcrun notarytool store-credentials signex-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$MACOS_KEYCHAIN" > /dev/null
          RESULT="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "$DMG" --keychain-profile signex-notary \
            --keychain "$MACOS_KEYCHAIN" --wait --timeout 30m \
            --output-format json > "$RESULT" || true
          STATUS="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("status",""))' "$RESULT" 2>/dev/null || true)"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("id",""))' "$RESULT" 2>/dev/null || true)"
          echo "notarization status: '${STATUS}' id: '${ID}'"
          if [[ "$STATUS" != "Accepted" ]]; then
            if [[ -n "$ID" ]]; then
              xcrun notarytool log "$ID" --keychain-profile signex-notary \
                --keychain "$MACOS_KEYCHAIN" || true
            fi
            echo "::error::notarization was not Accepted"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Verify DMG contains both architectures
        shell: bash
        run: |
          DMG="signex-macos-${ARCH_SUFFIX}-${VERSION}.dmg"
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly
          archs="$(lipo -archs "$MNT/Signex.app/Contents/MacOS/signex")"
          hdiutil detach "$MNT"
          echo "shipped binary archs: $archs"
          for a in x86_64 arm64; do
            [[ " $archs " == *" $a "* ]] || { echo "::error::$DMG is missing $a"; exit 1; }
          done

      - name: Smoke-test macOS DMG
        shell: bash
        run: |
          MNT="$RUNNER_TEMP/signex-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" \
            "signex-macos-${ARCH_SUFFIX}-${VERSION}.dmg"
          rc=0
          bash scripts/smoke_release_artifact.sh "$VERSION" "$MNT/Signex.app/Contents/MacOS/signex" || rc=$?
          hdiutil detach "$MNT" -force || true
          exit $rc

      - name: Remove macOS signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signex-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signex-signing.keychain-db" "$RUNNER_TEMP/signex-developer-id.p12" "$RUNNER_TEMP/notary-result.json"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signex-universal-apple-darwin-${{ needs.version.outputs.version }}
          path: signex-macos-*-${{ needs.version.outputs.version }}.dmg
          if-no-files-found: error

  # One CycloneDX SBOM per release for the `signex` binary's resolved
  # dependency graph (#362). Generated once, not per matrix leg: the graph
  # is the same everywhere because `--target all` resolves the platform-gated
  # dependencies of every target (windows-sys, objc2, x11, ...) instead of
  # the runner's host only. JSON because it is the format every SBOM consumer
  # reads; `--describe binaries` yields the shipped `signex` binary as the
  # root component (cargo-cyclonedx emits one file per workspace binary; only
  # `signex_bin.cdx.json` is kept: chrome-catalog and the library server are
  # not release artifacts). Runs on dry runs too, so the file can be
  # inspected from the run page. Read-only token: cargo-cyclonedx runs
  # `cargo metadata`, which fetches crates, and nothing here needs write access.
  sbom:
    name: SBOM (CycloneDX)
    needs: [version, verify-version]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Exact pin so a tag build is reproducible; bump deliberately.
      CARGO_CYCLONEDX_VERSION: "0.5.9"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.0 # keep in lockstep with rust-toolchain.toml

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version "=${CARGO_CYCLONEDX_VERSION}" --locked

      - name: Generate SBOM
        run: |
          cargo cyclonedx \
            --manifest-path crates/signex-app/Cargo.toml \
            --format json --spec-version 1.5 \
            --describe binaries --target all
          mkdir -p sbom
          mv crates/signex-app/signex_bin.cdx.json "sbom/signex-${VERSION}.cdx.json"

      # Fail the release rather than publish an empty or wrong SBOM.
      - name: Validate SBOM
        run: |
          python3 - "sbom/signex-${VERSION}.cdx.json" "$VERSION" <<'PY'
          import json, sys
          path, ver = sys.argv[1], sys.argv[2]
          bom = json.load(open(path, encoding="utf-8"))
          if bom.get("bomFormat") != "CycloneDX":
              sys.exit(f"not a CycloneDX SBOM: {bom.get('bomFormat')!r}")
          root = bom["metadata"]["component"]
          if root.get("name") != "signex" or root.get("version") != ver:
              sys.exit(f"SBOM root is not signex {ver}: {root}")
          names = {c["name"] for c in bom["components"]}
          for must in ("signex-types", "signex-engine", "iced", "wgpu"):
              if must not in names:
                  sys.exit(f"{must} missing from SBOM")
          print(f"SBOM ok: CycloneDX {bom['specVersion']}, {len(names)} components")
          PY

      # `signex-*` name so the release job's download pattern picks it up.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signex-sbom-${{ needs.version.outputs.version }}
          path: sbom/signex-${{ needs.version.outputs.version }}.cdx.json
          if-no-files-found: error

  # Tag pushes only: a workflow_dispatch dry run stops after the package-*
  # and sbom jobs and leaves their artifacts on the run page.
  release:
    name: Create Release
    needs: [build, package-windows, package-macos, sbom]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' && needs.sbom.result == 'success' && needs.package-windows.result == 'success' && needs.package-macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `signex-*` only: the intermediate `unsigned-*` binaries must not ship.
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: signex-*
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract CHANGELOG entry for this tag
        id: notes
        shell: bash
        run: |
          # Strip the leading "v" so CHANGELOG headings like
          # "## [0.7.0] — 2026-04-22" match regardless of tag prefix.
          TAG="${{ steps.version.outputs.version }}"
          VER="${TAG#v}"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "no CHANGELOG.md — will fall back to auto-generated notes"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pull the section from "## [VER]" (or "## VER") up to the
          # next "## " heading. python3 because bash regex across lines
          # is painful and the runner always has python.
          python3 - "$VER" > release-notes.md <<'PY'
          import re, sys
          from pathlib import Path
          ver = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Match "## [VER]" or "## VER" as the section heading.
          pat = re.compile(
              rf"^##\s+\[?{re.escape(ver)}\]?.*?(?=^##\s+|\Z)",
              re.DOTALL | re.MULTILINE,
          )
          m = pat.search(text)
          if not m:
              sys.exit(1)
          # Drop the heading line — GitHub already renders the tag as
          # the release title, so the duplicate "## [0.7.0]" on top of
          # the body looks noisy.
          body = m.group(0).split("\n", 1)[1] if "\n" in m.group(0) else m.group(0)
          print(body.strip())
          PY
          if [[ -s release-notes.md ]]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
            echo "----- CHANGELOG extract for $VER -----"
            cat release-notes.md
          else
            echo "no $VER section in CHANGELOG.md — falling back to auto-generated notes"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Signex ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          # Prefer the hand-authored CHANGELOG section; fall back to
          # GitHub's auto-generated PR-title summary if we couldn't
          # find one (so a missed update never blocks the release).
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && steps.notes.outputs.path || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          # Explicit list — the installer stack is what users want, the
          # tarball/zip are fallbacks for scripted installs.
          files: |
            artifacts/signex-setup-*.exe
            artifacts/signex-windows-*.zip
            artifacts/signex-macos-*.dmg
            artifacts/signex_*.deb
            artifacts/Signex-*.AppImage
            artifacts/signex-linux-*.tar.gz
            artifacts/signex-*.cdx.json
            artifacts/SHA256SUMS.txt
