# cargo-deny configuration for signex
#
# Enforces Apache-clean licensing: the main repo's transitive dependency
# closure may not contain GPL / AGPL / unlicensed crates.
#
# Run locally: `cargo deny check licenses`

[graph]
# All targets matter for license compliance, not just the host triple.
all-features = true

[licenses]
# Allowlist: permissive licenses compatible with Apache-2.0 redistribution.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OFL-1.1",          # Open Font License — used by some embedded font crates
    "CC0-1.0",          # public-domain dedications
    "MPL-2.0",          # weak-copyleft, file-level — acceptable for libraries
    "BSL-1.0",          # Boost — Apache-compatible
    "0BSD",             # zero-clause BSD
    "WTFPL",
    "Unlicense",
    "NCSA",             # University of Illinois/NCSA — BSD-3-equivalent, OSI-approved, Apache-compatible (libfuzzer-sys transitive)
    "CDLA-Permissive-2.0", # Community Data License Agreement — Linux Foundation, OSI-style permissive (webpki-roots transitive via reqwest/sqlx)
]

# Anything not in the allowlist is rejected. GPL / AGPL / LGPL / etc are
# explicitly absent from the allowlist and therefore denied by default.
confidence-threshold = 0.93

# Per-crate exceptions. Use sparingly — every entry is an audit trail
# datum that must be defensible.
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# `multiple-versions` stays "warn": the ~60 remaining duplicates are all
# transitive GUI-stack deps pinned by iced/winit/image with no clean remedy.
# Flipping to "deny" needs an enumerated `skip` list for those, generated and
# verified with cargo-deny locally — tracked as CI hardening.
multiple-versions = "warn"
# `glyphon` was removed when signex-gfx moved onto iced's wgpu 27 + the
# cryoglyph text shaper; re-adding it would relink a second wgpu/naga/
# cosmic-text stack, so it is banned outright as a regression guard.
deny = [{ name = "glyphon" }]

[advisories]
# Fixable advisories are fixed by upgrading (quick-xml, anyhow, h2, rustls,
# zip, git2, lopdf, ...). What remains below are "unmaintained" notices with
# no patched release to move to; each is a transitive dep (GUI/font/image/PDF
# stacks, tantivy search) or a direct font dep, and none is a reachable
# vulnerability. Every entry has a review date; re-run `cargo deny check`
# then and drop each entry whose upstream has moved on.
yanked = "warn"
ignore = [
    # core2 0.4.0 (yanked, unmaintained) <- bitstream-io <- rav1e <- image (AVIF).
    { id = "RUSTSEC-2026-0105", reason = "unmaintained, no upgrade; via image/rav1e/bitstream-io. Review 2027-01-22" },
    # instant 0.1.13 <- measure_time <- tantivy 0.22 (signex-library search).
    { id = "RUSTSEC-2024-0384", reason = "unmaintained, no upgrade; via tantivy/measure_time. Review 2027-01-22" },
    # paste 1.0.15 <- metal <- wgpu-hal (iced renderer).
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, build-time only; via wgpu/metal. Review 2027-01-22" },
    # rustybuzz 0.20.1 <- usvg <- resvg <- iced_tiny_skia.
    { id = "RUSTSEC-2026-0206", reason = "unmaintained, no upgrade; via resvg/usvg. Review 2027-01-22" },
    # ttf-parser 0.25.1: direct dep of signex-output (workspace ttf-parser = "0.25"),
    # plus transitively via fontdb (cosmic-text/cryoglyph, usvg, signex-app),
    # rustybuzz and lopdf <- pdf-extract <- signex-library.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no upgrade; via signex-output (direct), fontdb, rustybuzz, lopdf. Review 2027-01-22" },
    # zbus_names / zvariant / zvariant_derive <- zbus <- mundy <- iced_winit.
    { id = "RUSTSEC-2026-0371", reason = "unmaintained, no upgrade; via zbus/mundy/iced_winit. Review 2027-01-22" },
    { id = "RUSTSEC-2026-0370", reason = "unmaintained, no upgrade; via zbus/mundy/iced_winit. Review 2027-01-22" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained, no upgrade; via zbus/mundy/iced_winit. Review 2027-01-22" },
]

[sources]
# Only crates.io and the official rust-lang git registry are allowed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
